registry:
  sources:
    root_tree:
      spec: fasthep_carpenter.sources.root_tree:ROOT_TREE_SOURCE_SPEC
      impl: fasthep_carpenter.sources.root_tree:run_root_tree_source

  transforms:
    hep.project_fields:
      spec: fasthep_carpenter.operations.project_fields:PROJECT_FIELDS_SPEC
      impl: fasthep_carpenter.operations.project_fields:run_project_fields

    hep.zip_join:
      spec: fasthep_carpenter.operations.zip_join:ZIP_JOIN_SPEC
      impl: fasthep_carpenter.operations.zip_join:run_zip_join

    hep.define:
      spec: fasthep_carpenter.operations.define:DEFINE_SPEC
      impl: fasthep_carpenter.operations.define:run_define_transform

    hep.selection.cutflow:
      spec: fasthep_carpenter.operations.cutflow:CUTFLOW_SPEC
      impl: fasthep_carpenter.operations.cutflow:run_cutflow_transform

    hep.hist:
      spec: fasthep_carpenter.operations.hist:HIST_SPEC
      impl: fasthep_carpenter.operations.hist:run_hist_transform

    hep.di_object_mass:
      spec: fasthep_carpenter.operations.di_object_mass:DI_OBJECT_MASS_SPEC
      impl: fasthep_carpenter.operations.di_object_mass:run_di_object_mass_transform

    hep.weights.lookup_csv:
      spec: fasthep_carpenter.operations.weights.lookup_csv:LOOKUP_CSV_SPEC
      impl: fasthep_carpenter.operations.weights.lookup_csv:run_lookup_csv_transform

    hep.weights.pdf_envelope:
      spec: fasthep_carpenter.operations.weights.pdf_envelope:PDF_ENVELOPE_SPEC
      impl: fasthep_carpenter.operations.weights.pdf_envelope:run_pdf_envelope_transform

    cms.match_l1t_jets:
      spec: fasthep_carpenter.operations.cms.match_l1t_jets:CMS_MATCH_L1T_JETS_SPEC
      impl: fasthep_carpenter.operations.cms.match_l1t_jets:run_match_l1t_jets_transform

  sinks:
    root_tree:
      spec: fasthep_carpenter.sinks.root_tree:ROOT_TREE_WRITE_SPEC
      impl: fasthep_carpenter.sinks.root_tree:run_root_tree_write

  execution_modifiers:
    gpu.preload:
      impl: fasthep_carpenter.runtime.modifiers.gpu_preload:GPUPreloadModifier

  product_handlers:
    histogram:
      merge: fasthep_carpenter.products:merge_histogram_products
      materialize: fasthep_carpenter.products:materialize_histogram_product

    cutflow:
      merge: fasthep_carpenter.products:merge_cutflow_products
      materialize: fasthep_carpenter.products:materialize_cutflow_product

  functions:
    sqrt: numpy:sqrt
    abs: numpy:abs
    log: numpy:log
    log10: numpy:log10
    exp: numpy:exp
    where: numpy:where
    fill_none: awkward:fill_none
    pad_none: awkward:pad_none
    nth: fasthep_carpenter.expr_helpers:nth
    leading: fasthep_carpenter.expr_helpers:leading
    subleading: fasthep_carpenter.expr_helpers:subleading

  constants: {}
